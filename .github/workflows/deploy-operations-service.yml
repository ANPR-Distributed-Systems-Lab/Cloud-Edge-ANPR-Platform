name: Deploy operations-service

# Manual trigger for now: Actions -> "Deploy operations-service" -> Run workflow
# (choose the branch to build). Automatic deploys on merge to main come later.
#
# The deploy never changes the number of running tasks: switching the environment
# on and off is a separate concern (FinOps start/stop workflows).
on:
  workflow_dispatch:

# One deploy at a time. A running deploy is never cancelled halfway.
concurrency:
  group: deploy-operations-service
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: anpr/operations-service
  ECS_CLUSTER: anpr-dev
  ECS_SERVICE: anpr-dev-operations-service
  TASK_FAMILY: anpr-dev-operations-service
  CONTAINER_NAME: anpr-dev-operations-service

jobs:
  # ---------------------------------------------------------------- 1. tests
  # No AWS access needed here. If anything fails, no image is built.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: operations-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: operations-service/pom.xml

      # Unit tests first: seconds, no Docker. Fail fast.
      - name: Unit tests
        run: ./mvnw -B test

      # Then integration tests (*IT, Testcontainers). The runner provides Docker.
      - name: Integration tests
        run: ./mvnw -B verify

  # ---------------------------------------------------------------- 2. image
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The "dev" GitHub environment is part of the identity AWS checks (see the
    # role's trust policy) and can require manual approval.
    environment: dev
    permissions:
      id-token: write # lets the job request the OIDC token
      contents: read
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v7

      # TEMPORARY DEBUG (remove after the OIDC issue is fixed): prints the claims AWS
      # evaluates against the role's trust policy. Only the decoded claims are printed,
      # never the token itself.
      - name: Debug OIDC claims
        run: |
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" > /tmp/oidc.json
          python3 - <<'PY'
          import base64, json
          token = json.load(open("/tmp/oidc.json"))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("sub", "aud", "repository", "repository_owner", "environment", "ref", "job_workflow_ref"):
              print(f"{key}: {claims.get(key)!r}")
          PY
          rm -f /tmp/oidc.json

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The image is tagged with the commit sha. ECR tags are immutable, so a re-run
      # of the same commit must reuse the existing image instead of pushing again.
      - name: Compute image URI and check whether it already exists
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "uri=${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          if out=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" 2>&1); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<<"$out"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi

      # --provenance=false: push one plain image, without BuildKit's extra attestation manifest.
      - name: Build and push image
        if: steps.image.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          docker build --provenance=false -t "$IMAGE" operations-service
          docker push "$IMAGE"

  # ---------------------------------------------------------------- 3. deploy
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Start from the CURRENT task definition (Terraform may have changed CPU, memory,
      # environment...) and replace only the image. Terraform owns the shape, the pipeline owns the version.
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition --task-definition "$TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Set the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      # Registers the new revision, points the service at it, and waits until the
      # rollout is stable. If new tasks keep failing, the ECS circuit breaker rolls back
      # and this step fails.
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
