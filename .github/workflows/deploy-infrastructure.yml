name: Deploy infrastructure

# Manual trigger: Actions -> "Deploy infrastructure" -> Run workflow (choose the branch).
# Always runs checks and terraform plan; the plan is shown on the run page. The plan is applied
# only when "Apply the plan" is ticked, and exactly the plan that was just shown is applied.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the plan (leave unticked to only plan)
        type: boolean
        default: false

# One run at a time. A running apply is never cancelled halfway.
concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The GitHub environment is part of the identity AWS checks (see the role's trust policy).
    # It accepts only trusted branches, because the role is an administrator of the account.
    environment: dev-terraform
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infrastructure/envs/dev
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.17.0"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -no-color -out=tfplan

      # The same plan as in the log above, readable on the run page.
      - name: Plan summary
        run: |
          {
            echo '### Terraform plan'
            echo '```'
            terraform show -no-color tfplan | head -c 900000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.apply
        run: terraform apply -no-color tfplan
