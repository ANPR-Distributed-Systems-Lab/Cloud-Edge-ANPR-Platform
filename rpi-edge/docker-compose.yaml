# One service for both modes: EDGE_MODE in .env picks what main.py runs (README.md). Only one container
# ever holds the camera: changing the mode recreates this one.
services:
  rpi-edge:
    build: .
    privileged: true          # camera, GPIO, I2C and mounting the USB stick
    network_mode: host        # serves port 8000 on the Pi itself and lets the app show its own IP on the LCD
    restart: unless-stopped   # comes back by itself after power-up in the car
    stop_grace_period: 40s    # time to flush the last frames and unmount the USB stick on `docker stop`
    env_file:
      - path: .env            # EDGE_MODE and the cloud endpoints; copy .env.example. Without it: collection mode
        required: false
    volumes:
      - /dev:/dev                # camera, USB hot-plug, and picamera2 uses system RAM for buffers when it sees the host's /dev
      - /run/udev:/run/udev:ro   # libcamera finds the camera through the udev database
      - rpi-edge-config:/config  # settings of both modes and the device credentials, survive rebuilds
      - rpi-edge-state:/state    # detection mode: the outbox (SQLite) and the model cache
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .venv/
            - .git/
            - .idea/
            - .env
            - tests/
            - tools/
            - Dockerfile
            - docker-compose.yaml
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: rebuild
          path: Dockerfile

volumes:
  rpi-edge-config:
  rpi-edge-state:
