<table>
  <thead>
    <tr>
      <th>Plate</th>
      <th>Description</th>
      <th [attr.aria-sort]="ariaSort(SortField.CreatedAt)">
        <button type="button" (click)="sortChanged.emit(SortField.CreatedAt)">
          Created {{ arrow(SortField.CreatedAt) }}
        </button>
      </th>
      <th [attr.aria-sort]="ariaSort(SortField.LastDetectedAt)">
        <button type="button" (click)="sortChanged.emit(SortField.LastDetectedAt)">
          Last detected {{ arrow(SortField.LastDetectedAt) }}
        </button>
      </th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (alert of alerts(); track alert.alertId) {
      <tr>
        <td>{{ alert.plate }}</td>
        <td>{{ alert.alertText ?? '—' }}</td>
        <td>{{ alert.createdAt | date: 'short' }}</td>
        <td>{{ alert.lastDetectedAt ? (alert.lastDetectedAt | date: 'short') : 'Not detected yet' }}</td>
        <td>
          <button type="button" (click)="edited.emit(alert)">Edit</button>
          <button type="button" (click)="removed.emit(alert.alertId)">Remove</button>
        </td>
      </tr>
    } @empty {
      <tr><td colspan="5">No alerts</td></tr>
    }
  </tbody>
</table>
