openapi: 3.0.3
info:
  title: ANPR Operations API (Alerts-And-Views-Service)
  version: 0.3.0
  description: |
    Microservice 2 (Alerts-And-Views-Service) - Views 1, 2, 3, 6, alert management and the alert list for edge devices.
    Functional source of truth: docs/views-specification.md. Deviations from the architecture diagram are listed there
    in its deviations table and referenced below as D1..D18.
    The caller's account always comes from the token (API Gateway headers), never from request parameters (D3).
    One account owns exactly one device (the device id is unique per account in the accounts table).
    Plate numbers are always uppercase letters and digits without spaces - the client normalizes user input before sending.
    A request may carry X-Trace-Id (1 to 64 characters from A-Z a-z 0-9 -); otherwise the request id of API Gateway is
    used. It is returned in the response header X-Trace-Id and as requestId of errors.
servers:
  - url: /
security:
  - cognitoJwt: []
tags:
  - name: anprSearch
    description: View 1 - ANPR search and analysis panel
  - name: radialAnalysis
    description: View 2 - radial analysis and route verification (PostGIS)
  - name: liveFeed
    description: View 3 - main dashboard and real-time monitoring (Live Feed)
  - name: detections
    description: A single detection, opened from any view
  - name: alerts
    description: View 6 - alert management panel, and the alert list polled by the Raspberry Pi edge device

paths:
  /api/v1/detections/search:
    get:
      tags: [anprSearch]
      operationId: searchDetections
      summary: Search detections by plate and time range
      description: |
        View 1. Results are shown on a map with pins and as a list (D12).
        All filters are optional: the exact plate number and the time range (from-to).
        A side of the time range that is omitted is unbounded.
        Partial plate numbers are served by plate-suggestions (D13).
      parameters:
        - name: plate
          in: query
          description: Exact plate number
          schema: { $ref: '#/components/schemas/Plate' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/DetectionSize'
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/DetectionSortField' }
        - $ref: '#/components/parameters/Direction'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DetectionPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/detections/plate-suggestions:
    get:
      tags: [anprSearch]
      operationId: suggestPlates
      summary: Plate number suggestions (autocomplete)
      description: |
        View 1 - autocomplete of the plate search field. The client calls it from the 2nd typed character.
        D5 (proposal): the diagram places autocomplete inside the ANPR search.
      parameters:
        - name: q
          in: query
          required: true
          description: Plate prefix typed by the user (at least 2 characters)
          schema: { type: string, minLength: 2, maxLength: 10, pattern: '^[A-Z0-9]{2,10}$' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlateSuggestionList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/detections/radial-analysis:
    get:
      tags: [radialAnalysis]
      operationId: analyzeRadius
      summary: Detections within a radius of a point, plus the device route
      description: |
        View 2. Detections within radiusMeters of the given point in the time range,
        overlaid on the route of the edge device in the same time range.
        Not paginated - the map needs all points at once. Bounded instead (D10): a time range of at most 7 days,
        otherwise 400 VALIDATION_FAILED; at most 5000 detections and at most 5000 points per route, each with its own
        truncated flag. The density of the route is chosen by the client with trackIntervalSeconds: to get a whole
        range within the limit, use at least (range in seconds) / 5000, e.g. 121 for 7 days.
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the centre point (WGS 84)
          schema: { type: number, format: double, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          description: Longitude of the centre point (WGS 84)
          schema: { type: number, format: double, minimum: -180, maximum: 180 }
        - name: radiusMeters
          in: query
          required: true
          schema: { type: integer, minimum: 25, maximum: 5000 }
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: trackIntervalSeconds
          in: query
          description: |
            Minimal time between route points: the time range is split into windows of this length and the route has
            at most one point per window, the first one recorded in it. 1 returns every point (the device records at
            most one per second).
          schema: { type: integer, minimum: 1, maximum: 180, default: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RadialAnalysisResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/detections/live-feed:
    get:
      tags: [liveFeed]
      operationId: getLiveFeed
      summary: Latest detections, current device position and recent route
      description: |
        View 3. Map with the current position of the vehicle (Raspberry Pi) and its route
        from the last windowMinutes minutes, plus a list of the newest detections refreshed by polling.
        Incremental polling with an opaque cursor: it follows the order in which detections were stored by the server
        (ingestion time, then detectionId), not detectedAt, so detections buffered offline on the device
        (store-and-forward) are not skipped. At most 50 detections per response; hasMore tells to call again at once
        with nextCursor.
        Only detections stored at least 2 seconds before the request are returned: two batches stored at the same time
        can finish in a different order than they started, and the delay lets the slower one finish before the cursor
        passes it, so no detection is skipped and clients need no deduplication (docs/views-specification.md, known
        limitations).
      parameters:
        - name: cursor
          in: query
          description: nextCursor from the previous response, as received. Omit on the first call to get the 50 most recently ingested detections.
          schema: { type: string, maxLength: 200 }
        - name: windowMinutes
          in: query
          description: Length of the device route in minutes
          schema: { type: integer, minimum: 1, maximum: 60, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LiveFeedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/detections/{detectionId}:
    parameters:
      - name: detectionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [detections]
      operationId: getDetection
      summary: Get a single detection
      description: Details of a detection opened from a list or a map (D18 - not on the diagram).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Detection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts
      description: |
        View 6 and the edge device, one endpoint for both for now (D15).
        A person gets one page of the alerts of the account, sortable by creation date and by the date the alert
        was last triggered.
        A device gets all alerts of its owner in one response, whatever page, size and sort say, so every device of
        an account has the same list. It polls with conditional requests: send the last ETag in If-None-Match to get
        304 when nothing changed. Only devices get an ETag: the list of a person also shows lastDetectedAt, which
        moves with every detection.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/AlertSortField' }
        - $ref: '#/components/parameters/Direction'
        - name: If-None-Match
          in: header
          description: Devices only - ETag from the previous response
          schema: { type: string }
      responses:
        '200':
          description: OK
          headers:
            ETag:
              description: Devices only - weak validator of the list, changes whenever an alert is added, updated or deleted, and not when lastDetectedAt moves
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '304':
          description: Devices only - list unchanged since the given ETag
          headers:
            ETag:
              description: Current version of the list (the same value that was sent)
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [alerts]
      operationId: createAlert
      summary: Create an alert for a plate
      description: View 6. One alert per plate per account - a duplicate returns 409 ALERT_ALREADY_EXISTS (D9, proposal).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAlertRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created alert
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/alerts/{alertId}:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Get a single alert
      description: |
        View 6 - edit form and refresh after a 409 conflict.
        D6 (proposal): not on the architecture diagram.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [alerts]
      operationId: updateAlert
      summary: Update an alert
      description: |
        View 6. Replaces the alert text. The plate of an alert cannot be changed: to fix it, delete the alert and
        create a new one (D16). Optimistic locking - a stale version returns 409 CONCURRENT_MODIFICATION (D7).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAlertRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [alerts]
      operationId: deleteAlert
      summary: Delete an alert
      description: View 6.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    From:
      name: from
      in: query
      description: Start of the time range (inclusive) - unbounded when omitted
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: End of the time range (exclusive) - unbounded when omitted, must be after from when both are given
      schema: { type: string, format: date-time }
    FromRequired:
      name: from
      in: query
      required: true
      description: Start of the time range (inclusive)
      schema: { type: string, format: date-time }
    ToRequired:
      name: to
      in: query
      required: true
      description: End of the time range (exclusive) - must be after from
      schema: { type: string, format: date-time }
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    DetectionSize:
      name: size
      in: query
      description: Higher limit than other lists, because the map shows the results of a search (D13)
      schema: { type: integer, minimum: 1, maximum: 1000, default: 20 }
    Direction:
      name: direction
      in: query
      schema: { $ref: '#/components/schemas/SortDirection' }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid input (malformed value, constraint violation, malformed path id)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token - returned by API Gateway before the request reaches the service, so the body is not a Problem object
    NotFound:
      description: Resource does not exist or belongs to another account
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Business conflict (duplicate alert, concurrent modification)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details with extension fields
      required: [type, title, status, code, requestId]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable code, e.g. ALERT_NOT_FOUND, ALERT_ALREADY_EXISTS, CONCURRENT_MODIFICATION, VALIDATION_FAILED
        requestId:
          type: string
          description: Trace id of the request (also in the response header X-Trace-Id), to find it in the logs
        fields:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code:
          type: string
          description: REQUIRED, RANGE, SIZE or PATTERN (the same codes as device-management and the ingest Lambda)
        message: { type: string }

    Plate:
      type: string
      description: Full plate number - uppercase letters and digits, no spaces
      pattern: '^[A-Z0-9]{2,10}$'

    SortDirection:
      type: string
      enum: [ASC, DESC]
      default: DESC

    GeoPoint:
      type: object
      description: WGS 84 coordinates
      required: [lat, lon]
      properties:
        lat: { type: number, format: double }
        lon: { type: number, format: double }

    Detection:
      type: object
      description: |
        One ANPR detection. Diagram payload: device id, plate number, detection time, GPS coordinates, S3 key, alert id.
        The account id is omitted (D3). alertId is returned in every view, not only View 6 (D9).
        position is the GPS position of the edge device (our vehicle) at the moment of detection, not a measured position
        of the detected vehicle - it lies on the device route, a few to a dozen metres from the detected vehicle.
      required: [detectionId, deviceId, plate, detectedAt, position, ocrConfidence, detectorConfidence]
      properties:
        detectionId:
          type: string
          format: uuid
          description: Generated by the edge device - used for idempotent ingestion (D8)
        deviceId: { type: string, format: uuid }
        plate: { type: string, description: 'Plate number as stored - not re-validated in responses (OCR source)' }
        detectedAt:
          type: string
          format: date-time
          description: Time of detection according to the device clock
        position: { $ref: '#/components/schemas/GeoPoint' }
        ocrConfidence:
          type: number
          format: double
          description: Confidence of the plate text, 0 to 1, as reported by the edge device
        detectorConfidence:
          type: number
          format: double
          description: Confidence of the plate detection, 0 to 1, as reported by the edge device
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: Short-lived presigned S3 GET URL of the photo, null when no photo is stored (D4 - the diagram returns the S3 key)
        alertId:
          type: string
          format: uuid
          nullable: true
          description: Alert of this plate in the account, null when there is none. Derived from the plate when reading, not stored with the detection (D14)

    DetectionSortField:
      type: string
      enum: [DETECTED_AT, PLATE]
      default: DETECTED_AT

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }

    DetectionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Detection' }
        page: { $ref: '#/components/schemas/PageMeta' }

    PlateSuggestion:
      type: object
      description: Autocomplete entry (D9 - lastDetectedAt is an addition)
      required: [plate, lastDetectedAt]
      properties:
        plate: { type: string, description: 'Plate number as stored - not re-validated in responses (OCR source)' }
        lastDetectedAt: { type: string, format: date-time }

    PlateSuggestionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PlateSuggestion' }

    TrackPoint:
      type: object
      description: One device GPS position (diagram table device_locations - device coordinates, time)
      required: [position, recordedAt]
      properties:
        position: { $ref: '#/components/schemas/GeoPoint' }
        recordedAt: { type: string, format: date-time }

    DeviceTrack:
      type: object
      description: Route of one device, points ordered by recordedAt ascending (D9 - deviceId is an addition)
      required: [deviceId, points, truncated]
      properties:
        deviceId: { type: string, format: uuid }
        points:
          type: array
          maxItems: 5000
          description: At most one point per trackIntervalSeconds. When more than 5000 remain, the 5000 most recent.
          items: { $ref: '#/components/schemas/TrackPoint' }
        truncated:
          type: boolean
          description: True when more than 5000 points remained - raise trackIntervalSeconds or narrow the time range

    RadialAnalysisResponse:
      type: object
      description: View 2 response (D9 - center, radiusMeters and truncated are additions, D10 - not paginated)
      required: [center, radiusMeters, detections, tracks, truncated]
      properties:
        center: { $ref: '#/components/schemas/GeoPoint' }
        radiusMeters: { type: integer }
        detections:
          type: array
          maxItems: 5000
          description: Detections within the radius and time range, ordered by detectedAt ascending. When more than 5000 matched, the 5000 most recent.
          items: { $ref: '#/components/schemas/Detection' }
        tracks:
          type: array
          description: Device route for the whole time range, not clipped to the radius. One element per device (currently one device per account).
          items: { $ref: '#/components/schemas/DeviceTrack' }
        truncated:
          type: boolean
          description: True when more than 5000 detections matched - narrow the time range or radius

    DeviceLiveState:
      type: object
      description: Current state of one device (D9 - additions). A device with no known position is not listed.
      required: [deviceId, lastSeenAt, lastPosition, track]
      properties:
        deviceId: { type: string, format: uuid }
        lastSeenAt:
          type: string
          format: date-time
          description: Time of the latest known position
        lastPosition: { $ref: '#/components/schemas/GeoPoint' }
        track:
          type: array
          description: Route from the last windowMinutes minutes, ordered by recordedAt ascending
          items: { $ref: '#/components/schemas/TrackPoint' }

    LiveFeedResponse:
      type: object
      required: [nextCursor, hasMore, detections, devices]
      properties:
        nextCursor:
          type: string
          description: |
            Opaque cursor for the next poll, pass it unchanged as "cursor" (D9 - addition). Points after the last returned
            detection; when none were returned, it equals the cursor that was sent (on a first call in an account with no
            detections, a cursor that returns every detection stored later).
        hasMore:
          type: boolean
          description: True when more detections were stored after the last returned one - call again at once with nextCursor (D9 - addition)
        detections:
          type: array
          maxItems: 50
          description: |
            Detections stored after the cursor and at least 2 seconds before the request (on a first call, the 50 most
            recently stored of those), in the order they were stored, at most 50.
          items: { $ref: '#/components/schemas/Detection' }
        devices:
          type: array
          description: Current position and recent route of each device (currently one device per account). Empty when no position is known yet.
          items: { $ref: '#/components/schemas/DeviceLiveState' }

    CreateAlertRequest:
      type: object
      required: [plate]
      properties:
        plate: { $ref: '#/components/schemas/Plate' }
        alertText:
          type: string
          maxLength: 500
          description: Free-text description of the alert (the alert text field on the diagram)

    UpdateAlertRequest:
      type: object
      required: [version]
      properties:
        alertText:
          type: string
          maxLength: 500
          description: Free-text description of the alert (the alert text field on the diagram). Omitting it clears the text.
        version:
          type: integer
          format: int64
          description: Version from the last read - a mismatch returns 409 CONCURRENT_MODIFICATION (D7)

    AlertResponse:
      type: object
      description: |
        Diagram payload: plate number, creation time, alert text, last detection time.
        The account id is omitted (D3). alertId and version are additions (D7).
      required: [alertId, plate, createdAt, version]
      properties:
        alertId: { type: string, format: uuid }
        plate: { type: string, description: 'Plate number of the alert' }
        alertText: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastDetectedAt:
          type: string
          format: date-time
          nullable: true
          description: detectedAt of the latest detection of this plate in the account, computed when reading (D17); null if none
        version: { type: integer, format: int64 }

    AlertSortField:
      type: string
      enum: [CREATED_AT, LAST_DETECTED_AT]
      default: CREATED_AT

    AlertPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlertResponse' }
        page: { $ref: '#/components/schemas/PageMeta' }
