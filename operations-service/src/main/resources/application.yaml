spring:
  application:
    name: operations-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# Exposes /actuator/health/liveness and /readiness. The ECS container health check calls liveness
# (outside Kubernetes Spring Boot does not enable these probes by itself).
management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

app:
  aws:
    region: ${AWS_REGION:eu-central-1}
    sqs:
      device-events-queue-url: ${DEVICE_EVENTS_QUEUE_URL:}
