spring:
  application:
    name: device-management-service

# JSON log lines (Elastic Common Schema); the MDC (traceId) and the key-value pairs of a log call are fields.
logging:
  structured:
    format:
      console: ecs

# Exposes /actuator/health/liveness and /readiness. The ECS container health check calls liveness
# (outside Kubernetes Spring Boot does not enable these probes by itself).
management:
  endpoint:
    health:
      probes:
        enabled: true

app:
  # In AWS every value below comes from environment variables set by ECS
  # (infrastructure/envs/dev/device-management-service.tf). Required unless noted: startup fails when one is missing.
  aws:
    region: ${AWS_REGION:eu-central-1}               # region of every AWS client
    dynamodb:
      # Only for DynamoDB Local (development and tests), e.g. http://localhost:8000. Empty in AWS.
      endpoint: ${DYNAMODB_ENDPOINT:}
      tables:
        devices: ${DEVICES_TABLE:}                   # devices and their owners
        device-configurations: ${DEVICE_CONFIGURATIONS_TABLE:}  # one configuration per device (the settings below)
        device-metrics: ${DEVICE_METRICS_TABLE:}     # measurements reported by the devices
    s3:
      images-bucket: ${IMAGES_BUCKET:}               # photos of the detections, uploaded through presigned URLs
      models-bucket: ${MODELS_BUCKET:}               # published model versions (ml-models, anpr-publish-model)
    cognito:
      user-pool-id: ${USER_POOL_ID:}                 # the pool of people and devices
      users-group: ${USERS_GROUP:}                   # group of the people
      devices-group: ${DEVICES_GROUP:}               # group of the device accounts
    sns:
      device-events-topic-arn: ${DEVICE_EVENTS_TOPIC_ARN:}  # device.paired / device.unpaired events

  overview:
    # A device is online while its latest measurement is younger than this many of its metrics intervals.
    online-within-metrics-intervals: 3

  metrics:
    retention: 7d          # how long measurements are kept; older ones are refused
    max-clock-skew: 5m     # how far in the future a recordedAt may be (device clock ahead)

  images:
    upload-url-validity: 30m  # lifetime of a presigned PUT URL for a photo
    # The same limits as detectedAt in the ingest Lambda.
    max-capture-age: 30d      # photos captured earlier get no upload URL
    max-clock-skew: 5m        # how far in the future a capture time may be

  models:
    # Lifetime of a presigned GET URL of a model file: long enough for the largest model over a slow mobile link.
    download-url-validity: 30m

  # The configuration a new device starts with. Must satisfy the ranges of device-management-api.yaml
  # (checked by DefaultSettingsIT). This is the only place defaults live: a device runs on what this service
  # gives it and keeps just a local copy (rpi-edge/DETECTION.md).
  configuration:
    defaults:
      plate-cooldown-seconds: 60          # the same plate is not sent again within this time
      batching:
        detections-batch-size: 20         # detections per ingest request
        locations-batch-size: 100         # track points per request
        image-urls-batch-size: 20         # photos per presigned URL request
        image-uploads-low-priority: true  # photos go out only while the other streams have nothing to send
        max-batch-delay-seconds: 10       # a batch that is not full leaves after this long
      # The send rule: starting points of the ml-models analysis on val (ML_ASSUMPTIONS.md, section 9); the
      # final thresholds are still open there.
      ml:
        detector-min-confidence: 0.40     # detections below this confidence are dropped
        ocr-min-confidence: 0.80          # readings whose least certain character is below this are not sent
        readable-min-probability: 0.80    # readings the OCR rates less likely readable than this are not sent
        min-plate-width-px: 70            # narrower plates (in the 4056 px frame) are not read
        min-edge-margin-px: 10            # plates this close to the frame edge are not read (may be cut off)
      # Must be published (ml-models, anpr-publish-model) before a device can download them.
      models:
        detector: v3                      # version of the plate detector
        ocr: v3                           # version of the OCR
      intervals:
        metrics-seconds: 60               # how often the device reports its metrics
        config-poll-seconds: 60           # how often it polls this configuration
        alerts-poll-seconds: 60           # how often it polls the alert list
        location-sample-seconds: 5        # how often it records a point of its track
      gps:
        max-fix-age-seconds: 30           # an older fix is not the position of a frame: its plates are not read
      photos:
        width-px: 4056                    # width of the uploaded photo (4056 = full frame, less = downscaled, 4:3 kept)
        jpeg-quality: 90                  # JPEG quality of the uploaded photo
        max-waiting-frames: 3             # frames (~37 MB each) waiting for the JPEG encoder; more lose their photo
        max-stored: 2000                  # photos kept on the device until uploaded; beyond it the oldest go
      # Tested on the Pi: automatic exposure capped at 540 us, so passing plates stay sharp.
      camera:
        exposure:
          mode: AUTO                      # exposure time first, then gain (see ExposureConfiguration)
          exposure-us: 500                # exposure time of MANUAL and AUTO_GAIN
          gain: 2.0                       # analogue gain of MANUAL and AUTO_EXPOSURE
          max-exposure-us: 540            # longest exposure time the automatic modes may use
          max-gain: 4.0                   # highest gain the automatic modes may use
          target-brightness: 0.4          # mean brightness (0 to 1) the automatic modes aim for
          # Rows measured by the automatic modes (shares of the frame height, full width): the band of detector v3,
          # where the plates pass.
          metering-top: 0.337
          metering-bottom: 0.795
        white-balance:
          mode: DAYLIGHT                  # a preset of the camera, or MANUAL with the gains below
          red-gain: 2.0                   # red gain of MANUAL
          blue-gain: 1.6                  # blue gain of MANUAL
        fps: 3.0                          # the most frames analysed per second
        # The devices built so far hold the camera upside down.
        hflip: true                       # mirror horizontally
        vflip: true                       # flip vertically
